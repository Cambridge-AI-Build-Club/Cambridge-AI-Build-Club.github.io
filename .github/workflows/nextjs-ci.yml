# Build-only check. Every pull request runs it (the root collections, *.md pages and
# _data/ files are build inputs too, not just web/). This workflow never deploys:
# the live site is deployed by nextjs.yml on pushes to main.
name: Build Next.js site (no deploy)

on:
  push:
    branches: [nextjs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          DESIGN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Upload exported site for inspection
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-out
          path: web/out
          retention-days: 7
